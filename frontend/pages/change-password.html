<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | EduTrack</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f7fc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.container h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px 40px 12px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    font-size:15px;
}

.input-box span{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#666;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

</style>

</head>
<body>

<div class="container">

<h2>Change Password</h2>

<form id="changePasswordForm">

<div class="input-box">
<input type="password" id="currentPassword" placeholder="Current Password" required>
<span onclick="togglePassword('currentPassword',this)">
<i class="fa-solid fa-eye"></i>
</span>
</div>

<div class="input-box">
<input type="password" id="newPassword" placeholder="New Password" required>
<span onclick="togglePassword('newPassword',this)">
<i class="fa-solid fa-eye"></i>
</span>
</div>

<div class="input-box">
<input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
<span onclick="togglePassword('confirmPassword',this)">
<i class="fa-solid fa-eye"></i>
</span>
</div>

<button type="submit">Change Password</button>

</form>

</div>

<script>

const API_URL="https://edutrack-m2ls.onrender.com/api/auth";

const form=document.getElementById("changePasswordForm");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const currentPassword=document.getElementById("currentPassword").value;

const newPassword=document.getElementById("newPassword").value;

const confirmPassword=document.getElementById("confirmPassword").value;

if(newPassword!==confirmPassword){

alert("Passwords do not match");

return;

}

const token=localStorage.getItem("token");

const response=await fetch(`${API_URL}/change-password`,{

method:"PUT",

headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${token}`
},

body:JSON.stringify({

currentPassword,

newPassword

})

});

const data=await response.json();

alert(data.message);

if(response.ok){

window.location.href="dashboard.html";

}

});

function togglePassword(id,element){

const input=document.getElementById(id);

const icon=element.querySelector("i");

if(input.type==="password"){

input.type="text";

icon.classList.replace("fa-eye","fa-eye-slash");

}else{

input.type="password";

icon.classList.replace("fa-eye-slash","fa-eye");

}

}

</script>

</body>
</html>
