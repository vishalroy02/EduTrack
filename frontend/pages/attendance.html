<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
padding:30px;
}

.container{
max-width:1100px;
margin:auto;
}

.page-title{
text-align:center;
margin-bottom:25px;
color:#1976d2;
}

.card{
background:#fff;
border-radius:10px;
padding:20px;
margin-bottom:25px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.profile{
display:flex;
align-items:center;
gap:25px;
flex-wrap:wrap;
}

.profile img{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #1976d2;
}

.profile-details{
flex:1;
}

.profile-details h2{
margin-bottom:15px;
color:#1976d2;
}

.profile-details p{
margin:8px 0;
font-size:16px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:15px;
}

.summary-box{
background:#1976d2;
color:white;
padding:20px;
border-radius:8px;
text-align:center;
}

.summary-box h3{
font-size:18px;
margin-bottom:10px;
}

.summary-box p{
font-size:28px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

table th{
background:#1976d2;
color:white;
padding:12px;
}

table td{
padding:12px;
text-align:center;
border:1px solid #ddd;
}

.present{
color:green;
font-weight:bold;
}

.absent{
color:red;
font-weight:bold;
}

.back-btn{
display:block;
margin:30px auto 0;
padding:14px 35px;
border:none;
background:#1976d2;
color:white;
font-size:16px;
cursor:pointer;
border-radius:6px;
transition:.3s;
}

.back-btn:hover{
background:#125aa0;
}

@media(max-width:768px){

.profile{
flex-direction:column;
text-align:center;
}

.profile-details{
text-align:left;
width:100%;
}

.summary{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1 class="page-title">
📅 Student Attendance History
</h1>

<!-- Student Details -->

<div class="card">

<h2 style="margin-bottom:20px;">
👨‍🎓 Student Details
</h2>

<div class="profile">

<img
id="studentPhoto"
src="https://via.placeholder.com/130"
>

<div class="profile-details">

<p><b>Name :</b> <span id="studentName"></span></p>

<p><b>Email :</b> <span id="studentEmail"></span></p>

<p><b>Roll No :</b> <span id="studentRoll"></span></p>

<p><b>Department :</b> <span id="studentDepartment"></span></p>

<p><b>Semester :</b> <span id="studentSemester"></span></p>

<p><b>Phone :</b> <span id="studentPhone"></span></p>

</div>

</div>

</div>

<!-- Attendance Summary -->

<div class="card">

<h2>
📊 Attendance Summary
</h2>

<div class="summary">

<div class="summary-box">

<h3>Total Classes</h3>

<p id="totalClasses">0</p>

</div>

<div class="summary-box">

<h3>Present</h3>

<p id="presentClasses">0</p>

</div>

<div class="summary-box">

<h3>Absent</h3>

<p id="absentClasses">0</p>

</div>

<div class="summary-box">

<h3>Attendance %</h3>

<p id="attendancePercent">0%</p>

</div>

</div>

</div>

<!-- Attendance Table -->

<div class="card">

<h2>
📋 Complete Attendance History
</h2>

<table>

<thead>

<tr>

<th>Date</th>

<th>Status</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>

</div>

<button
class="back-btn"
onclick="goBack()"
>

⬅ Back to Dashboard

</button>

<script>

const role = localStorage.getItem("role");

let apiURL = "";

if(role === "parent"){

    const rollNo = localStorage.getItem("selectedStudentRollNo");

    apiURL = `https://edutrack-m2ls.onrender.com/api/student/roll/${rollNo}`;

}else{

    const userId = localStorage.getItem("userId");

    apiURL = `https://edutrack-m2ls.onrender.com/api/student/${userId}`;

}

fetch(apiURL)
.then(res=>res.json())
.then(data=>{

window.studentData=data;

const student=data.student;

//================ Student Details =================

document.getElementById("studentName").innerText=
student.name;

document.getElementById("studentEmail").innerText=
student.email;

document.getElementById("studentRoll").innerText=
student.rollNo || "-";

document.getElementById("studentDepartment").innerText =
student.department || "-";

document.getElementById("studentSemester").innerText =
student.semester || "-";

document.getElementById("studentPhone").innerText=
student.phone || "-";

if(student.photo){

document.getElementById("studentPhoto").src=
`https://edutrack-m2ls.onrender.com/uploads/${student.photo}`;

}

//================ Attendance Summary =================

document.getElementById("totalClasses").innerText=
data.attendanceSummary.total;

document.getElementById("presentClasses").innerText=
data.attendanceSummary.present;

document.getElementById("absentClasses").innerText=
data.attendanceSummary.absent;

document.getElementById("attendancePercent").innerText=
data.attendanceSummary.percentage + "%";

//================ Attendance Table =================

let html="";

data.attendance
.sort((a,b)=>new Date(b.date)-new Date(a.date))
.forEach(item=>{

html+=`

<tr>

<td>

${new Date(item.date).toLocaleDateString("en-GB")}

</td>

<td class="${
item.status==="present"
?
"present"
:
"absent"
}">

${
item.status==="present"
?
"✅ Present"
:
"❌ Absent"
}

</td>

</tr>

`;

});

document.getElementById("attendanceTable").innerHTML=html;

})
.catch(err=>{

console.log(err);

alert("Unable to load attendance.");

});

//================ Back =================

function goBack(){

window.location.href="dashboard.html";

}
</script>

</body>
</html>
